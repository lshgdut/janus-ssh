services:
  sshd:
    image: linuxserver/openssh-server:latest
    container_name: janus-test-sshd
    ports:
      - "2222:22"
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
      - SUDO_ACCESS=true
    volumes:
      - ./ssh-keys:/config
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: janus-test-postgres
    environment:
      - POSTGRES_PASSWORD=testpass
    ports:
      - "15432:5432"