# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration


[changelog]
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n", limit=1) | first | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based parsers to modify commit messages prior to further processing.
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
    # Replace the placeholder <REPO> with a URL.
    #{ pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" },
]
# render body even when there are no releases to process
# render_always = true
# output file path
# output = "test.md"

# commit_preprocessors 在 parse 阶段跑 — 这是处理 gitmoji prefix 的
# 正确位置。`fix` / `feat` 都在 RFC U+1F300~U+1F6FF / U+1F900~U+1F9FF / U+2600~U+27BF
# 范围。regex 完后 commit message 变成 "fix(scope): xxx",default commit_parsers
# 接管。
commit_preprocessors = [
    # 去掉 commit subject 头部的 emoji(包含修饰符 + ZWJ)+ 可能的空白。
    { pattern = '^[^\\x00-\\x7F][\\x00-\\x7F]*?(?=\\s+[A-Za-z])', replace = '' },
]

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# filter_unconventional:false 让任何 commit(包括 typo commit 像 ":ch ...")
# 走 "💼 Other" fall-through 而不是被 warn-and-skip。这跟仓库历史 commit
# 风格相关 —— 几个 commit subject 实际是 conventional 但有 typo,cliff 2.x 的
# regex parser 太严格,会全部 warn。这条 false 让它们进 Other 而不是丢。
filter_unconventional = false
# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
    # 截断 commit body — 只用 subject(第一行),不展开多行 commit message
    # body 里的解释段不适合直接进 CHANGELOG(尤其是仓库 multi-paragraph
    # commit message 的习惯),保留 subject 就够了。
    { pattern = '\n.*$', replace = "" },
    # Replace issue numbers with link templates to be updated in `changelog.postprocessors`.
    #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
    # Check spelling of the commit message using https://github.com/crate-ci/typos.
    # If the spelling is incorrect, it will be fixed automatically.
    #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
commit_parsers = [
    # Gitmoji prefix 用 Rust regex 字符类。\x{...} 是 Rust unicode escape,
    # regex crate 支持完整范围。emoji 在 U+1F300-U+1FAFF + U+2600-U+27BF。
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>feat)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 0 -->🚀 Features" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>fix)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>docs?)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 3 -->📚 Documentation" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>perf)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 4 -->⚡ Performance" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>refactor)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>style)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 5 -->🎨 Styling" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>test)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 6 -->🧪 Testing" },
    # chore-release / deps / pr 跳过
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>chore)\\(release\\): prepare for.+", skip = true },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>chore)\\(deps.*\\).+", skip = true },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>chore)\\(pr\\).+", skip = true },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>chore)\\(pull\\).+", skip = true },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>chore|ci)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>security)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 8 -->🛡️ Security" },
    { message = "^([\\x{1F300}-\\x{1F6FF}\\x{1F900}-\\x{1F9FF}\\x{2600}-\\x{27BF}])\\s+(?P<type>revert)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 9 -->◀️ Revert" },
    # 无 gitmoji 的 fallback — 仓库 pre-history 或没走 emoji 的 commit
    { message = "^(?P<type>feat)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 0 -->🚀 Features" },
    { message = "^(?P<type>fix)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 1 -->🐛 Bug Fixes" },
    # 全 fall-through — 任何 conventional-style 但前面 emoji parser 没接上的 commit
    { message = "^(?P<type>[a-zA-Z]+)(?:\\((?P<scope>[^)]+)\\))?!?:\\s+(?P<subject>.+)", group = "<!-- 10 -->💼 Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false
