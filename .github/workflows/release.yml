name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build + Notarize + DMG
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch tags — git-cliff 要遍历 git history,默认 shallow checkout 会
          # 拿不到 v0.1.0 / v0.1.1 / v0.2.0 等历史 tag。
          fetch-depth: 0

      - name: Install git-cliff
        run: brew install git-cliff

      - name: Update CHANGELOG via git-cliff
        # 只跑当有上一个 tag(不是 v0.1.0 这种 first release)。
        # cliff.toml 里的 body / footer 模板 — 见仓库根 cliff.toml。
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "No previous tag — first release, skipping CHANGELOG regen"
            exit 0
          fi
          echo "Regenerating CHANGELOG.md: $PREV..HEAD → v$VERSION"
          git cliff --tag "$PREV..HEAD" --bump "$VERSION" --topo-order > CHANGELOG.md
          git add CHANGELOG.md
          if ! git diff --cached --quiet -- CHANGELOG.md; then
            git commit -m "🔖 chore(release): update CHANGELOG for v${VERSION}"
            git push origin "$GITHUB_REF_NAME"
          fi

      - name: Import Notarization Profile
        run: |
          mkdir -p ~/notary
          echo "${{ secrets.NOTARY_PROFILE_KEY }}" > ~/notary/JanusSSH-Notarize.keychain-profile
          security import ~/notary/JanusSSH-Notarize.keychain-profile

      - name: Build + Sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          bash scripts/release.sh $VERSION

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/JanusSSH-*.zip
            build/JanusSSH-*.dmg

  homebrew:
    name: Update Homebrew Cask
    runs-on: macos-15
    needs: release
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lshgdut/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask sha256
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          DMG="build/JanusSSH-${VERSION}.dmg"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          sed -i '' "s/version \"[0-9.]*\"/version \"${VERSION}\"/" homebrew/janus-ssh.rb
          sed -i '' "s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA}\"/" homebrew/janus-ssh.rb

      - name: Commit + Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homebrew/janus-ssh.rb
          git commit -m "janus-ssh: bump to v${GITHUB_REF#refs/tags/v}"
          git push